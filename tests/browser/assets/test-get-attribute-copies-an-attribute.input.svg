<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attrExpr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    viewBox="-215 -326 431 386"
>
    <title>The text 'The unfortunate label' with a calculated 'y' attribute</title>
    <script crossorigin="anonymous" href="evaluate-for-current-document.js"></script>
    <g>
        <text csvg:doc-local-id="source" text-anchor="middle" attrExpr:y="{{ 0 - 51 }}">The unfortunate label</text>
        <text attrExpr:y="{{ document.localIdToElement.get('source').getAttribute('y') }}">The tex'd</text>
    </g>
</svg>