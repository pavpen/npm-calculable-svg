<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attr-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    xmlns:attr-output-name="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/attribute-name"
    xmlns:const-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/jinja"
    attr-expr:viewbox="
      {{- Math.round(document.getConst('labelBBox').x) }}{{ ' ' }}
      {{- Math.round(document.getConst('labelBBox').y) }}{{ ' ' }}
      {{- Math.round(document.getConst('labelBBox').width) }}{{ ' ' }}
      {{- Math.round(document.getConst('labelBBox').height) }}"
    attr-output-name:viewbox="viewBox"
>
    <!--
        When SVG is embedded in an HTML document, the browser may parse it
        using HTML, rather than XML parsing rules.  In this case attribute
        names are lowecased, and namespace definition attributes are ignored.
        In the above example, we test the use of `attr-output-name:` to
        capitalize the name of the output attribute.
    -->
    <title>The text 'The unfortunate label' with a calculated bounding box</title>
    <script crossorigin="anonymous" href="evaluate-for-current-document.js"></script>
    <style>
        /* Use a fixed to font to avoid test output changes due to font substitution: */
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;family=Noto+Serif:ital,wght@0,100..900;1,100..900&amp;display=swap');
        .label {
            font-size: 48px;
            font-family: "Noto Serif", serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
    </style>
    <csvg:consts
        const-expr:labelBBox="document.localIdToElement.get('label').getBBox()"
    />
    <text csvg:doc-local-id="label" class="label" text-anchor="middle">
        The unfortunate label</text>
</svg>