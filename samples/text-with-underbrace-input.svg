<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attrExpr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    xmlns:constExpr="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/jinja"
    csvg:live-update="true"
    attrExpr:viewBox="
        {{- document.getConst('contentBBox').x - document.getConst('braceStrokeWidthPx') / 2 }}{{ ' ' }}
        {{- document.getConst('contentBBox').y - document.getConst('braceStrokeWidthPx') / 2 }}{{ ' ' }}
        {{- document.getConst('contentBBox').width + document.getConst('braceStrokeWidthPx') }}{{ ' ' }}
        {{- document.getConst('contentBBox').height + document.getConst('braceStrokeWidthPx') }}"
>
    <title>
        The label "Wondering what's over" above the label "Hoverable", the
        latter spanned by a brace under it.
    </title>
    <desc>
        Used to demonstrate Calculable SVG elements that respond to style
        changes.  The "Hoverable" label changes size on mouse hover using an
        animation to transition between sizes.  The size of the under-brace is
        calculated from the size of the "Hoverable" label as the former
        changes.
    </desc>
    <script crossorigin="anonymous" href="../evaluate-for-current-document-debug.js"></script>
    <style>
        .static-label {
            font-size: 56px;
            stroke-width: 0.5px;
            fill: #00f;
            stroke: #757575;
        }
        .responsive-label {
            font-size: 48px;
            stroke-width: 0.5px;
            fill: #00f;
            stroke: #757575;
            /* An transition animation for showing CSVG live update on hover: */
            transition: font-size 0.5s ease, fill 1s ease, stroke 0.5s ease;
        }
        .responsive-label:hover {
            font-size: 56px;
            fill: #757575;
            stroke: #00f;
        }
        .brace {
            stroke: #000;
            stroke-width: 4.8px;
            fill: none;
        }
    </style>
    <!-- Configuration: -->
    <csvg:consts
        constExpr:contentBBox="document.localIdToElement.get('content').getBBox()"
        constExpr:fontSizePx="document.localIdToElement.get('responsive-label').getUsedStyleDimensions().fontSizePx"
        constExpr:braceToBaseLineDistancePx="document.getConst('fontSizePx') * 0.2"
        constExpr:braceStrokeWidthPx="document.localIdToElement.get('brace').getUsedStyleDimensions().strokeWidthPx"
        constExpr:braceHandDepthPx="document.getConst('fontSizePx') * 0.2"
        constExpr:braceHandCornerRadiusPx="document.getConst('fontSizePx') * 0.05"
        constExpr:braceMouthDepthPx="document.getConst('fontSizePx') * 0.2"
        constExpr:braceMouthWidthPx="document.getConst('fontSizePx') * 0.25"
        constExpr:braceMouthCornerRadiusPx="document.getConst('fontSizePx') * 0.05"
        constExpr:braceSpanPx="document.localIdToElement.get('responsive-label-container').getBBox().width"
    />
    <!-- Brace segment calculations: -->
    <csvg:consts
        constExpr:braceHandStraightLengthPx="document.getConst('braceHandDepthPx') - document.getConst('braceHandCornerRadiusPx')"
        constExpr:braceSpanStraightLengthPx="document.getConst('braceSpanPx') / 2 - document.getConst('braceHandCornerRadiusPx') - document.getConst('braceMouthWidthPx') / 2"
        constExpr:braceMouthVertDistPastCornerPx="document.getConst('braceMouthDepthPx') - document.getConst('braceMouthCornerRadiusPx')"
        constExpr:braceMouthCornerCosAngleQuadEqA="document.getConst('braceMouthVertDistPastCornerPx') * document.getConst('braceMouthVertDistPastCornerPx') + document.getConst('braceMouthWidthPx') * document.getConst('braceMouthWidthPx') / 4"
        constExpr:braceMouthCornerCosAngleQuadEqB="2 * document.getConst('braceMouthCornerRadiusPx') * document.getConst('braceMouthVertDistPastCornerPx')"
        constExpr:braceMouthCornerCosAngleQuadEqC="document.getConst('braceMouthCornerRadiusPx') * document.getConst('braceMouthCornerRadiusPx') - document.getConst('braceMouthWidthPx') * document.getConst('braceMouthWidthPx') / 4"
        constExpr:braceMouthCornerCosAngle="(-document.getConst('braceMouthCornerCosAngleQuadEqB') + Math.sqrt(document.getConst('braceMouthCornerCosAngleQuadEqB') * document.getConst('braceMouthCornerCosAngleQuadEqB') - 4 * document.getConst('braceMouthCornerCosAngleQuadEqA') * document.getConst('braceMouthCornerCosAngleQuadEqC'))) / (2 * document.getConst('braceMouthCornerCosAngleQuadEqA'))"
        constExpr:braceMouthCornerSinAngle="Math.sqrt(1 - document.getConst('braceMouthCornerCosAngle') * document.getConst('braceMouthCornerCosAngle'))"
        constExpr:braceMouthCornerHorizontalSizePx="document.getConst('braceMouthCornerRadiusPx') * document.getConst('braceMouthCornerSinAngle')"
        constExpr:braceMouthCornerVerticalSizePx="document.getConst('braceMouthCornerRadiusPx') * (1 - document.getConst('braceMouthCornerCosAngle'))"
        constExpr:braceMouthStraightLengthHorizontalComponentPx="document.getConst('braceMouthWidthPx') / 2 - document.getConst('braceMouthCornerHorizontalSizePx')"
        constExpr:braceMouthStraightLengthVerticalComponentPx="document.getConst('braceMouthDepthPx') - document.getConst('braceMouthCornerVerticalSizePx')"
    />
    <g csvg:doc-local-id="content">
        <path csvg:doc-local-id="brace" class="brace"
            attrExpr:d="
            {{- '' }}M1,{{ document.getConst('braceToBaseLineDistancePx') }}
            {{- ' ' }}v{{ document.getConst('braceHandStraightLengthPx') }}
            {{- ' ' }}a{{ document.getConst('braceHandCornerRadiusPx') }},{{ document.getConst('braceHandCornerRadiusPx') }},0,0,0,{{ document.getConst('braceHandCornerRadiusPx') }},{{ document.getConst('braceHandCornerRadiusPx') }}
            {{- ' ' }}h{{ document.getConst('braceSpanStraightLengthPx') }}
            {{- ' ' }}a{{ document.getConst('braceMouthCornerRadiusPx') }},{{ document.getConst('braceMouthCornerRadiusPx') }},0,0,1,{{ document.getConst('braceMouthCornerHorizontalSizePx') }},{{ document.getConst('braceMouthCornerVerticalSizePx') }}
            {{- ' ' }}l{{ document.getConst('braceMouthStraightLengthHorizontalComponentPx') }},{{ document.getConst('braceMouthStraightLengthVerticalComponentPx') }}
            {{- ' ' }}l{{ document.getConst('braceMouthStraightLengthHorizontalComponentPx') }},{{ 0 - document.getConst('braceMouthStraightLengthVerticalComponentPx') }}
            {{- ' ' }}a{{ document.getConst('braceMouthCornerRadiusPx') }},{{ document.getConst('braceMouthCornerRadiusPx') }},0,0,1,{{ document.getConst('braceMouthCornerHorizontalSizePx') }},{{ 0 - document.getConst('braceMouthCornerVerticalSizePx') }}
            {{- ' ' }}h{{ document.getConst('braceSpanStraightLengthPx') }}
            {{- ' ' }}a{{ document.getConst('braceHandCornerRadiusPx') }},{{ document.getConst('braceHandCornerRadiusPx') }},0,0,0,{{ document.getConst('braceHandCornerRadiusPx') }},{{ 0 - document.getConst('braceHandCornerRadiusPx') }}
            {{- ' ' }}v{{ 0 - document.getConst('braceHandStraightLengthPx') }}{{ '' -}}
            " />
        <text class="static-label"
            x="0"
            attrExpr:y="{{ 0 - document.localIdToElement.get('responsive-label-container').getBBox().height - document.getConst('fontSizePx') * 0.2 }}">
            Wondering what's over</text>
        <!-- Wrap the <text/> in a </g>, so that we can get the bounding box
            of the current pseudo element (like '::hover'): -->
        <g csvg:doc-local-id="responsive-label-container">
            <text csvg:doc-local-id="responsive-label" class="responsive-label" x="0" y="0"
                text-anchor="start">Hoverable</text>
        </g>
    </g>
</svg>