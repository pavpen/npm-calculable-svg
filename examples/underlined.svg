<svg xmlns="http://www.w3.org/2000/svg" xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attr-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    xmlns:attr-name="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/attribute-name"
    xmlns:const-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/jinja"
    csvg:live-update="true"
    attr-name:viewbox="viewBox"
    attr-expr:viewbox="{{ document.getConst('contentBBox').x }} {{ document.getConst('contentBBox').y }} {{ document.getConst('contentBBox').width }} {{ document.getConst('contentHeight') }}"
    viewBox="0 -46.26173400878906 659.0194091796875 68.09554595947266">
    <title>The text "Important: Don't pay attention!", underlined</title>
    <!-- Adding the following script renders calculables in this document: -->
    <script crossorigin="anonymous" href="../evaluate-for-current-document-debug.js" />
    <style>
    <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Radley:ital@0;1&display=swap');
        /**
         * Embed font for loading this SVG in `<img/>`
         * https://fonts.googleapis.com/css2?family=Noto+Serif&amp;display=swap&amp;text=Important%3A%20Don%27t%20pay%20attention!.
         *
         * License: https://fonts.google.com/specimen/Radley/license?categoryFilters=Serif:%2FSerif%2FOld+Style+Garalde&preview.script=Latn
         */
        @font-face {
            font-family: 'Radley Embedded';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(data:font/woff2;base64,) format('woff2');
            unicode-range: U+20-21, U+27, U+3a, U+44, U+49, U+61, U+65, U+69, U+6d-70, U+72, U+74, U+79;
        }
        g {
            color-scheme: light dark;
        }
        .label {
            font-family: "Radley Embedded", "Radley", serif;
            font-size: 48px;
            fill: light-dark(#000000, #e0e000);
            text-shadow: 1px 2px 1px light-dark(#fff, #000);
            filter: drop-shadow(1px 1px 3px light-dark(#fff, #000));
            margin-bottom: 7.2px;
        }
        .underline {
            stroke: #fc0004;
            stroke-width: 3px;
        }
        .underline-border {
            stroke: #757575;
            stroke-width: 5px;
        }
    ]]>
    </style>
    <csvg:consts>
        <csvg:const csvg:name="contentBBox">document.localIdToElement.get('content').getBBox()</csvg:const>
        <csvg:const csvg:name="labelFontSizePx">
            document.localIdToElement.get('label').getUsedStyleDimensions().fontSizePx</csvg:const>
        <csvg:const csvg:name="labelMarginBottomPx">
            document.localIdToElement.get('label').getUsedStyleDimensions().marginBottomPx</csvg:const>
        <csvg:const csvg:name="labelWidthPx">document.localIdToElement.get('label').getBBox().width</csvg:const>
        <csvg:const csvg:name="underlineBorderWidthPx">
            document.localIdToElement.get('underlineBorder').getUsedStyleDimensions().StrokeWidth</csvg:const>
        <csvg:const csvg:name="contentHeight">
            Math.max(
                document.getConst('labelMarginBottomPx') + document.getConst('labelFontSizePx') * 0.15 + document.localIdToElement.get('underlineBorder').getUsedStyleDimensions().strokeWidthPx / 2,
                document.getConst('contentBBox').height
            ) + document.getConst('labelMarginBottomPx')</csvg:const>
    </csvg:consts>
    <g csvg:doc-local-id="content">
        <path csvg:doc-local-id="underlineBorder" class="underline-border"
            attr-expr:d="M0,{{ document.getConst('labelMarginBottomPx') }} H{{ document.getConst('labelWidthPx') }} M0,{{ document.getConst('labelMarginBottomPx') + document.getConst('labelFontSizePx') * 0.15 }} H{{ document.getConst('labelWidthPx') }}"
            d="M0,7.2 H659.0194091796875 M0,14.399999999999999 H659.0194091796875" />
        <path class="underline"
            attr-expr:d="{{ document.localIdToElement.get('underlineBorder').getAttribute('d') }}"
            d="M0,7.2 H659.0194091796875 M0,14.399999999999999 H659.0194091796875" />
        <text csvg:doc-local-id="label" class="label">Important: Don't pay attention!</text>
    </g>
</svg>