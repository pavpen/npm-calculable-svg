<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attr-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    xmlns:attr-name="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/attribute-name"
    xmlns:const-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/jinja"
    csvg:live-update="true"
    attr-name:viewbox="viewBox"
    attr-expr:viewbox="
        {{ document.localIdToElement.get('content').getBBox().x -
            document.getConst('borderStrokeWidthPx') * Math.sqrt(3) }}
        {{ document.localIdToElement.get('content').getBBox().y -
            document.getConst('borderStrokeWidthPx') * 2 / Math.sqrt(3) }}
        {{ document.localIdToElement.get('content').getBBox().width +
            document.getConst('borderStrokeWidthPx') * 2 * Math.sqrt(3) }}
        {{ document.localIdToElement.get('content').getBBox().height +
            document.getConst('borderStrokeWidthPx') * (1 + 2 / Math.sqrt(3)) }}"
>
    <title>The title text 'Title', followed by subtitle text
        'Beware of titles' inside an triangular warning-sign border</title>
    <!-- Adding the following script renders calculables in this document: -->
    <script crossorigin="anonymous" href="../evaluate-for-current-document-debug.js"></script>
    <style>
        .title {
            font-size: 48px;
            fill: #000000;
            margin-bottom: 2px;
        }
        .subtitle {
            font-size: 30px;
            fill: #000000;
            padding-left: 15px;
            padding-right: 15px;
            padding-bottom: 15px;
        }
        .border {
            stroke: #fc0004;
            stroke-width: 30px;
            stroke-linejoin: round;
            /* Make some allowance for vampires using dark mode: */
            fill: rgba(255, 255, 255, 0.85);
        }
        .border-outline {
            stroke: #ffffff;
            stroke-width: 32px;
            fill: none;
        }
    </style>
    <csvg:consts>
        <csvg:const csvg:name="titleFontSizePx">document.localIdToElement.get('title').getUsedStyleDimensions().fontSizePx</csvg:const>
        <csvg:const csvg:name="titleMarginBottomPx">document.localIdToElement.get('title').getUsedStyleDimensions().marginBottomPx</csvg:const>
        <csvg:const csvg:name="subtitleFontSizePx">document.localIdToElement.get('subtitle').getUsedStyleDimensions().fontSizePx</csvg:const>
        <csvg:const csvg:name="elevationCoefficient">0.5</csvg:const>
        <csvg:const csvg:name="labelWidth">
            document.localIdToElement.get('label').getBBox().width +
            document.localIdToElement.get('subtitle').getUsedStyleDimensions().paddingLeftPx +
            document.localIdToElement.get('subtitle').getUsedStyleDimensions().paddingRightPx
        </csvg:const>
        <csvg:const csvg:name="labelHeight">
            document.localIdToElement.get('label').getBBox().height +
            document.localIdToElement.get('subtitle').getUsedStyleDimensions().paddingBottomPx
        </csvg:const>
        <csvg:const csvg:name="borderSideLength">
            document.getConst('labelWidth') / (1 - document.getConst('elevationCoefficient') / 2) +
            document.getConst('labelHeight') * 2 / Math.sqrt(3)
        </csvg:const>
        <csvg:const csvg:name="borderHeight">document.getConst('borderSideLength') * Math.sqrt(3) / 2</csvg:const>
        <csvg:const csvg:name="borderStartY">document.getConst('subtitleFontSizePx')</csvg:const>
        <csvg:const csvg:name="borderStrokeWidthPx">document.localIdToElement.get('border').getUsedStyleDimensions().strokeWidthPx</csvg:const>
    </csvg:consts>
    <g csvg:doc-local-id="content">
        <!-- The octagon enclosing the label: -->
        <path csvg:doc-local-id="borderOutline"
            class="border-outline"
            attr-expr:d="
            M{{ 0 - document.getConst('borderSideLength') / 2 }},{{ document.getConst('borderStartY') }}
            L0,{{ document.getConst('borderStartY') - document.getConst('borderHeight') }}
            L{{ document.getConst('borderSideLength') / 2 }},{{ document.getConst('borderStartY') }}
            z"/>
        <path csvg:doc-local-id="border" class="border"
            attr-expr:d="{{ document.localIdToElement.get('borderOutline').getAttribute('d') }}"/>
        <g csvg:doc-local-id="label">
            <text csvg:doc-local-id="title" class="title"
                attr-expr:y="{{
                    0 - document.getConst('titleMarginBottomPx')
                    - document.getConst('titleFontSizePx')
                    - document.localIdToElement.get('subtitle').getUsedStyleDimensions().paddingBottomPx
                }}"
                text-anchor="middle">
                Title</text>
            <text csvg:doc-local-id="subtitle" class="subtitle"
                attr-expr:y="{{ 0 - document.localIdToElement.get('subtitle').getUsedStyleDimensions().paddingBottomPx }}"
                text-anchor="middle">
                Beware of titles</text>
        </g>
    </g>
</svg>