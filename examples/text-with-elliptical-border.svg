<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:csvg="http://xmlns.pavpen.dev/calculable-svg/0.1"
    xmlns:attr-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/jinja"
    xmlns:attr-output-name="http://xmlns.pavpen.dev/calculable-svg/0.1/attribute-expression/attribute-name"
    xmlns:const-expr="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/jinja"
    xmlns:const-name="http://xmlns.pavpen.dev/calculable-svg/0.1/const-expression/const-name"
    attr-expr:viewbox="
        {{ document.getConst('contentBBox').x - document.getConst('borderStrokeWidthPx') / 2 }}
        {{ document.getConst('contentBBox').y - document.getConst('borderStrokeWidthPx') / 2 }}
        {{ document.getConst('contentBBox').width + document.getConst('borderStrokeWidthPx') }}
        {{ document.getConst('contentBBox').height + document.getConst('borderStrokeWidthPx') }}"
    attr-output-name:viewbox="viewBox"
>
    <!--
        https://developer.mozilla.org/en-US/docs/Web/API/SVGGraphicsElement/getBBox#options
        are not stable, yet.  We manually calculate the stroke bounding box above.
    -->
    <title>The text 'The unfortunate label' inside an ellipse</title>
    <!-- Adding the following script renders calculables in this document: -->
    <script crossorigin="anonymous" href="../evaluate-for-current-document-debug.js"></script>
    <style>
        .label {
            font-size: 48px;
            stroke-width: 0.5px;
            fill: #000000;
            stroke: #757575;
            padding-bottom: 48px;
        }
        .border {
            stroke: #0400ac;
            stroke-width: 18px;
            fill: none;
        }
    </style>
    <csvg:consts
        const-name:content-bbox="contentBBox"
        const-expr:content-bbox="document.localIdToElement.get('content').getBBox()"
        const-name:label-width="labelWidth"
        const-expr:label-width="
            document.localIdToElement.get('label').getBBox().width +
            document.localIdToElement.get('label').getUsedStyleDimensions().paddingLeftPx +
            document.localIdToElement.get('label').getUsedStyleDimensions().paddingRightPx
            "
        const-name:label-height="labelHeight"
        const-expr:label-height="
            document.localIdToElement.get('label').getBBox().height +
            document.localIdToElement.get('label').getUsedStyleDimensions().paddingTopPx +
            document.localIdToElement.get('label').getUsedStyleDimensions().paddingBottomPx
            "
        const-name:label-middle-y="labelMiddleY"
        const-expr:label-middle-y="
            document.localIdToElement.get('label').getBBox().y +
            document.localIdToElement.get('label').getBBox().height / 2
            "
        const-name:semi-vertical-axis="semiVerticalAxis"
        const-expr:semi-vertical-axis="
            document.getConst('labelHeight') / 2 +
            Math.max(
                document.localIdToElement.get('label').getUsedStyleDimensions().paddingTopPx,
                document.localIdToElement.get('label').getUsedStyleDimensions().paddingBottomPx
            )"
        const-name:semi-horizontal-axis="semiHorizontalAxis"
        const-expr:semi-horizontal-axis="
            document.getConst('labelWidth') /
            Math.sqrt(Math.abs(
                4 -
                (document.getConst('labelHeight') * document.getConst('labelHeight')) /
                (document.getConst('semiVerticalAxis') * document.getConst('semiVerticalAxis'))
            ))
            "
        const-name:border-stroke-width-px="borderStrokeWidthPx"
        const-expr:border-stroke-width-px="document.localIdToElement.get('border').getUsedStyleDimensions().strokeWidthPx"
    />
    <g csvg:doc-local-id="content">
        <ellipse csvg:doc-local-id="border" class="border"
            cx="0"
            attr-expr:cy="{{ document.getConst('labelMiddleY') }}"
            attr-expr:rx="{{ document.getConst('semiHorizontalAxis') }}"
            attr-expr:ry="{{ document.getConst('semiVerticalAxis') }}" />
        <text csvg:doc-local-id="label" class="label" text-anchor="middle">
            The unfortunate label</text>
    </g>
</svg>